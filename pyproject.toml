[project]
name = "kpmn-tracer"
version = "0.2.1"
description = "Adds a TV-style ball tracer to golf range videos"
requires-python = ">=3.11"

[project.scripts]
kpmn-tracer = "kpmn_tracer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools"]
addopts = "-ra"
markers = [
    "slow: long running end-to-end tests (deselect with -m 'not slow')",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kpmn_tracer*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "B008", "B905"]  # zip(strict=) adds noise for equal-length arrays
